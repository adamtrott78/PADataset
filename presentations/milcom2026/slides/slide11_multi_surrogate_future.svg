<tspan x="96" y="103">VarMax can search across surrogates; DQNGuard must learn how to</tspan>
<tspan x="96" y="157">combine them</tspan>
</text>
</g>
<g id="supporting_sentence">
<text id="text_2" x="96" y="193" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#5D6C7B" text-anchor="start">
<tspan x="96" y="193">In VarMax, surrogates change calibration parameters; in DQNGuard, the surrogate changes the learned open-set decision function</tspan>
<tspan x="96" y="224">itself.</tspan>
</text>
</g>
