<text id="text_36" x="96" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#102235" text-anchor="start">
<tspan x="96" y="1008">Goal: reduce dependence on a favorable single surrogate while preserving DQNGuard&#x27;s strong thresholded operating point and explicit 5% known-rejection budget.</tspan>
</text>
