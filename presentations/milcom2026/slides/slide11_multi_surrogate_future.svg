<tspan x="1296" y="850">HYBRID VARMAX / DQNGUARD</tspan>
</text>
<text id="text_34" x="1296" y="918" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102235" text-anchor="start">
<tspan x="1296" y="918">multi-surrogate deterministic guard evidence</tspan>
<tspan x="1296" y="948">+ one DQN signal</tspan>
</text>
</g>
