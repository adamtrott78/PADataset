<text id="text_22" x="980" y="644" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1F6FEB" text-anchor="start">
<tspan x="980" y="644.0">DIFFERENT LEARNED SCORE SPACES</tspan>
</text>
<text id="text_23" x="980" y="678" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#102235" text-anchor="start">
<tspan x="980" y="678">Thresholds are not directly interchangeable across separately fitted</tspan>
<tspan x="980" y="706">DQNs.</tspan>
</text>
<text id="text_25" x="980" y="735" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#102235" text-anchor="start">
<tspan x="980" y="735">Current DQNGuard also withholds its external surrogate from the backbone taxonomy.</tspan>
</text>
