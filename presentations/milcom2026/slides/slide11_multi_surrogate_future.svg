</text>
<text id="text_28" x="120" y="918" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102235" text-anchor="start">
<tspan x="120" y="918">A + B + C surrogate states</tspan>
<tspan x="120" y="948">→ ONE DQN → one score space</tspan>
</text>
