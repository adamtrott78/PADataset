name: PADataset Lambda Scientific Single GPU 2

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  padataset-scientific-2:
    name: "${{ format('wc-admission-v1|workload=scientific-single-gpu-2|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-scientific-2 ')
    runs-on: lambda-padataset-scientific-single-gpu-2
    timeout-minutes: 360

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-scientific-2 SHA" >&2
            exit 20
          }
          [[ "$(printf '%s\n' "$COMMENT_BODY" | awk 'NF{print NF}')" == "3" ]] || {
            echo "Scientific trigger requires exact SHA plus one bounded request token" >&2
            exit 21
          }
          request_token="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $3}')"
          if [[ "$request_token" != "smoke" ]] &&
             [[ ! "$request_token" =~ ^train_backbone:manifests/configs/[A-Za-z0-9_./-]+\.json$ ]] &&
             [[ ! "$request_token" =~ ^stage03_archc:manifests/configs/[A-Za-z0-9_./-]+\.json$ ]] &&
             [[ ! "$request_token" =~ ^l2o_directional_eval:manifests/configs/l2o_directional_eval_v1/[A-Za-z0-9_.-]+\.json$ ]] &&
             [[ ! "$request_token" =~ ^archb_cross_surrogate:manifests/configs/archb_cross_surrogate_v1/[A-Za-z0-9_.-]+\.json$ ]]; then
            echo "Scientific request token rejected" >&2
            exit 23
          fi

          pr_json="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])'               <<<"$pr_json"
          )"
          head_repo="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])'               <<<"$pr_json"
          )"
          state="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])'               <<<"$pr_json"
          )"

          [[ "$state" == "open" ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 22
          }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "request_token=$request_token" >> "$GITHUB_OUTPUT"

      - name: Prove bounded scientific runner
        id: preflight
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-padataset-2" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${P5_GPU_TARGET_UUID:-}" ]]
          [[ "${P5_GPU_TARGET_UUID}" == "GPU-cfed3394-a935-63aa-9325-c4cae7b568b6" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "$P5_GPU_TARGET_UUID" ]]

          [[ -n "${P5_EXPANDED_RUNTIME:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_PYTHON:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" ]]
          [[ -x "$P5_EXPANDED_RUNTIME_PYTHON" ]]
          [[ -r "$P5_EXPANDED_RUNTIME" ]]
          [[ ! -w "$P5_EXPANDED_RUNTIME" ]]

          trusted_data="/srv/workspace-ci/padataset/trusted-cache/scientific-data/ota_core_high_run01_len16384_v1"
          [[ -d "$trusted_data" ]]
          [[ -r "$trusted_data/promotion.json" ]]
          [[ ! -w "$trusted_data" ]]
          [[ -n "$(find "$trusted_data" -maxdepth 1 -type f -name '*.h5' -print -quit)" ]]

          python3 - "$trusted_data/promotion.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text())
          assert d["schema"] == "padataset.scientific-data-promotion.v1"
          assert d["profile_id"] == "ota_core_high_run01_len16384_v1"
          assert d["read_only_hardened"] is True
          assert d["cache_len"] == 16384
          assert d["dataset_tag"] == "ota_core_high_run01"
          assert d["noise_tag"] == "high_run01"
          assert int(d["file_count"]) > 0
          PY

          [[ ! -r /home/atrott ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /srv/workspace-ci/research-engine ]]
          [[ ! -r /var/lib/workspace-ci/provisioner ]]
          [[ ! -r /run/workspace-ci ]]
          if [[ -e /var/run/docker.sock ]]; then
            [[ ! -r /var/run/docker.sock ]]
            [[ ! -w /var/run/docker.sock ]]
          fi

          echo "trusted_data=$trusted_data" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate bounded scientific request
        id: request
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_TOKEN: ${{ steps.gate.outputs.request_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          python3 - "$EXPECTED_SHA" "$REQUEST_TOKEN" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys

          expected_sha, request_token, output_path = sys.argv[1:4]
          if not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("scientific candidate SHA invalid")

          if request_token == "smoke":
              op = "smoke"
              config_path = ""
          elif ":" in request_token:
              op, config_path = request_token.split(":", 1)
              if op not in {"train_backbone", "stage03_archc", "l2o_directional_eval", "archb_cross_surrogate"}:
                  raise SystemExit(f"unsupported scientific operation: {op!r}")
              root = pathlib.Path.cwd().resolve()
              resolved = (root / config_path).resolve()
              if not resolved.is_file() or resolved.is_symlink():
                  raise SystemExit("config/request is not a regular repository file")

              if op == "l2o_directional_eval":
                  if not re.fullmatch(
                      r"manifests/configs/l2o_directional_eval_v1/[A-Za-z0-9_.-]+\.json",
                      config_path,
                  ):
                      raise SystemExit("directional evaluator request path rejected")
                  allowed = (root / "manifests" / "configs" / "l2o_directional_eval_v1").resolve()
                  try:
                      resolved.relative_to(allowed)
                  except ValueError:
                      raise SystemExit("directional evaluator request path escape")
                  req = json.loads(resolved.read_text())
                  if req.get("schema") != "padataset.l2o-directional-eval-request.v1":
                      raise SystemExit("directional evaluator request schema mismatch")
                  if req.get("status") != "READY_FOR_BOUNDED_EVALUATOR":
                      raise SystemExit("directional evaluator request is not ready")
                  if req.get("policy_id") != "l2o_dqnguard_track_a_frozen_v1":
                      raise SystemExit("directional evaluator policy_id drift")
                  if req.get("canonical_matrix") != "manifests/l2o_canonical_backbone_matrix_v1.json":
                      raise SystemExit("directional evaluator canonical matrix drift")
                  if req.get("evaluation_policy") != "manifests/l2o_directional_eval_policy_v1.json":
                      raise SystemExit("directional evaluator policy path drift")
                  if req.get("checkpoint") != "best_model":
                      raise SystemExit("directional evaluator checkpoint drift")
                  if req.get("target_labels_used_for_tuning") is not False:
                      raise SystemExit("directional evaluator permits target tuning")
              elif op == "archb_cross_surrogate":
                  if not re.fullmatch(
                      r"manifests/configs/archb_cross_surrogate_v1/[A-Za-z0-9_.-]+\.json",
                      config_path,
                  ):
                      raise SystemExit("Architecture-B evaluator request path rejected")
                  allowed = (root / "manifests" / "configs" / "archb_cross_surrogate_v1").resolve()
                  try:
                      resolved.relative_to(allowed)
                  except ValueError:
                      raise SystemExit("Architecture-B evaluator request path escape")
                  req = json.loads(resolved.read_text())
                  if req.get("schema") != "padataset.archb-cross-surrogate-eval-request.v1":
                      raise SystemExit("Architecture-B request schema mismatch")
                  if req.get("status") != "READY_FOR_BOUNDED_EVALUATOR":
                      raise SystemExit("Architecture-B request is not evaluator-ready")
                  if req.get("architecture") != "B":
                      raise SystemExit("Architecture-B architecture drift")
                  stage = req.get("stage")
                  expected = {
                      "B0": ("mth602_archb_b0_frozen_v1", "softmax3", False),
                      "B1": ("mth602_archb_b1_frozen_v1", "expanded5", False),
                      "B2": ("mth602_archb_b2_frozen_v1", "softmax3", True),
                      "B3": ("mth602_archb_b3_frozen_v1", "softmax3", True),
                  }.get(stage)
                  if expected is None:
                      raise SystemExit("Architecture-B stage drift")
                  expected_policy, expected_state, expected_bands = expected
                  if req.get("policy_id") != expected_policy:
                      raise SystemExit("Architecture-B policy drift")
                  if req.get("target_pa") != "PA2":
                      raise SystemExit("Architecture-B target drift")
                  if req.get("state_mode") != expected_state:
                      raise SystemExit("Architecture-B state drift")
                  if bool(req.get("class_conditional_bands", False)) != expected_bands:
                      raise SystemExit("Architecture-B class-band mode drift")
                  if bool(req.get("tune_band_weights", False)) != (stage == "B3"):
                      raise SystemExit("Architecture-B band-weight tuning mode drift")
                  if stage == "B1":
                      if req.get("predeclared_stage_transition") is not True:
                          raise SystemExit("Architecture-B B1 is not predeclared")
                      if req.get("b0_target_metrics_used_for_b1_parameters") is not False:
                          raise SystemExit("Architecture-B B1 permits target-driven parameters")
                  if stage == "B2":
                      if req.get("predeclared_stage_transition") is not True:
                          raise SystemExit("Architecture-B B2 is not predeclared")
                      if req.get("target_metrics_used_for_state_mode_selection") is not False:
                          raise SystemExit("Architecture-B B2 permits target-driven state selection")
                      decision = req.get("state_mode_decision") or {}
                      if decision.get("selected_state_mode") != "softmax3":
                          raise SystemExit("Architecture-B B2 state decision drift")
                      if float(decision.get("b0_selected_worst_cross_unknown_f1", -1)) != 0.003686635944700461:
                          raise SystemExit("Architecture-B B2 B0 decision evidence drift")
                      if float(decision.get("b1_selected_worst_cross_unknown_f1", -1)) != 0.0:
                          raise SystemExit("Architecture-B B2 B1 decision evidence drift")
                      if int(decision.get("b0_artifact_id", -1)) != 14354747328:
                          raise SystemExit("Architecture-B B2 B0 artifact drift")
                      if int(decision.get("b1_artifact_id", -1)) != 14361967189:
                          raise SystemExit("Architecture-B B2 B1 artifact drift")
                      band = req.get("band_policy") or {}
                      if band.get("candidate_guard_training") != "own_pseudo_surrogate_only":
                          raise SystemExit("Architecture-B B2 guard training drift")
                      if band.get("composite_score") != "dqn_margin_plus_guard_cdf":
                          raise SystemExit("Architecture-B B2 composite score drift")
                  if stage == "B3":
                      if req.get("predeclared_stage_transition") is not True:
                          raise SystemExit("Architecture-B B3 is not predeclared")
                      if req.get("target_metrics_used_for_b3_trigger_or_tuning") is not False:
                          raise SystemExit("Architecture-B B3 permits target-driven tuning")
                      trigger = req.get("b3_trigger") or {}
                      if int(trigger.get("b2_artifact_id", -1)) != 14369751106:
                          raise SystemExit("Architecture-B B3 B2 artifact drift")
                      if trigger.get("b2_artifact_digest") != "sha256:e5d76e4b8b90c101218a7c3603c9fd92d8e87b439eaffa36a9f46a1525e17d00":
                          raise SystemExit("Architecture-B B3 B2 digest drift")
                      if float(trigger.get("b2_selected_mean_cross_unknown_f1", -1)) != 0.12087985437740191:
                          raise SystemExit("Architecture-B B3 trigger mean-F1 drift")
                      if trigger.get("all_b2_candidate_guard_weights_uniform") is not True:
                          raise SystemExit("Architecture-B B3 trigger weight-collapse drift")
                      search = req.get("b3_search_policy") or {}
                      if search.get("weight_rules") != [
                          "uniform",
                          "gap_only",
                          "variance_only",
                          "energy_only",
                          "gap_variance_equal",
                          "gap_energy_equal",
                          "variance_energy_equal",
                          "absolute_median_separation",
                      ]:
                          raise SystemExit("Architecture-B B3 weight-rule search drift")
                      if search.get("guard_scales") != [0.5, 1.0, 2.0]:
                          raise SystemExit("Architecture-B B3 guard-scale search drift")
                      if search.get("dqn_state_mode") != "softmax3":
                          raise SystemExit("Architecture-B B3 DQN state drift")
                      if search.get("dqn_training_changed") is not False:
                          raise SystemExit("Architecture-B B3 changed DQN training")
                      if search.get("selection_evidence") != "off_diagonal_pseudo_open_only":
                          raise SystemExit("Architecture-B B3 selection evidence drift")
                      if search.get("candidate_guard_training") != "own_pseudo_surrogate_only":
                          raise SystemExit("Architecture-B B3 guard fitting drift")
                      if search.get("threshold_source") != "known_only":
                          raise SystemExit("Architecture-B B3 threshold source drift")
                  if req.get("checkpoint") != "best_model":
                      raise SystemExit("Architecture-B checkpoint drift")
                  if float(req.get("known_budget", -1)) != 0.05:
                      raise SystemExit("Architecture-B known budget drift")
                  if int(req.get("partition_seed", -1)) != 1701:
                      raise SystemExit("Architecture-B partition seed drift")
                  if int(req.get("dqn_episodes", -1)) != 30:
                      raise SystemExit("Architecture-B DQN episode drift")
                  if req.get("target_labels_used_for_fitting") is not False:
                      raise SystemExit("Architecture-B permits target fitting")
                  if req.get("target_labels_used_for_thresholding") is not False:
                      raise SystemExit("Architecture-B permits target thresholding")
                  if req.get("target_labels_used_for_candidate_selection") is not False:
                      raise SystemExit("Architecture-B permits target candidate selection")
                  if req.get("target_first_consumed_after_winner_frozen") is not True:
                      raise SystemExit("Architecture-B target consumption ordering drift")
                  src = req.get("source_backbone") or {}
                  if int(src.get("artifact_id", -1)) != 14180249360:
                      raise SystemExit("Architecture-B source artifact drift")
                  if src.get("artifact_digest") != "sha256:f7de2637df85487b21903a448630815fc63c1247253b98ffc754b46586b9b39b":
                      raise SystemExit("Architecture-B source artifact digest drift")
                  if int(src.get("workflow_run_id", -1)) != 43751609944:
                      raise SystemExit("Architecture-B source workflow drift")
                  if src.get("candidate_sha") != "befe383fd67c8bca8d8ce370344b33c7e13cd52f":
                      raise SystemExit("Architecture-B source candidate drift")
              else:
                  if not re.fullmatch(
                      r"manifests/configs/[A-Za-z0-9_./-]+\.json", config_path
                  ):
                      raise SystemExit("config path rejected")
                  try:
                      resolved.relative_to(root / "manifests" / "configs")
                  except ValueError:
                      raise SystemExit("config path escape")
                  cfg = json.loads(resolved.read_text())
                  if cfg.get("skip_cache_build") is not True:
                      raise SystemExit("scientific config must use an existing trusted cache")
                  if cfg.get("force_rebuild_cache") is not False:
                      raise SystemExit("scientific config may not rebuild cache")
                  if int(cfg.get("cache_len", -1)) != 16384:
                      raise SystemExit("scientific v1 requires cache_len=16384")
                  if cfg.get("source_type") != "ota":
                      raise SystemExit("scientific v1 requires OTA source")
                  if cfg.get("source_name") != "ota_core_high_run01":
                      raise SystemExit("source_name mismatch")
                  if cfg.get("dataset_tag") != "ota_core_high_run01":
                      raise SystemExit("dataset_tag mismatch")
                  if cfg.get("noise_tag") != "high_run01":
                      raise SystemExit("noise_tag mismatch")

                  if op == "stage03_archc":
                      if cfg.get("unknown_pas") != ["PA2"]:
                          raise SystemExit("Stage 03 v1 requires PA2 target")
                      if set(cfg.get("pas") or []) != {"PA1","PA2","PA3","PA4","PA8"}:
                          raise SystemExit("Stage 03 v1 requires five-PA taxonomy")
                      if cfg.get("early_stopping_mode") != "known_only":
                          raise SystemExit("Stage 03 v1 requires known-only checkpoint selection")
                      if cfg.get("quarantine_target_until_test") is not True:
                          raise SystemExit("Stage 03 v1 requires target quarantine")
                      if float(cfg.get("open_val_frac", -1)) != 0.0:
                          raise SystemExit("Stage 03 v1 requires zero target-open validation")
          else:
              raise SystemExit("scientific request token rejected")

          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"operation={op}\n")
              out.write(f"config_path={config_path}\n")
          PY

      - name: Execute bounded scientific request
        id: scientific
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          OPERATION: ${{ steps.request.outputs.operation }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
          TRUSTED_DATA: ${{ steps.preflight.outputs.trusted_data }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          runtime_python="$P5_EXPANDED_RUNTIME_PYTHON"
          result_root="$RUNNER_TEMP/scientific-results"
          mkdir -p "$result_root"

          "$runtime_python" - <<'PY'
          import json, os, pathlib
          import h5py, matplotlib, numpy, pandas, scipy, sklearn, torch
          payload = {
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_device_count": int(torch.cuda.device_count()),
              "cuda_device_name": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "runtime": os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256": os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
          }
          if not payload["cuda_available"] or payload["cuda_device_count"] != 1:
              raise SystemExit(f"scientific runtime GPU gate failed: {payload}")
          pathlib.Path(os.environ["RUNNER_TEMP"], "scientific-runtime-smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          if [[ "$OPERATION" == "smoke" ]]; then
            cp "$RUNNER_TEMP/scientific-runtime-smoke.json" "$result_root/runtime-smoke.json"
          elif [[ "$OPERATION" == "archb_cross_surrogate" ]]; then
            request_path="$CONFIG_PATH"
            eval_dir="$result_root/archb_eval"
            mkdir -p "$eval_dir"

            pre_resolved="$RUNNER_TEMP/archb-pre-resolved.json"
            "$runtime_python" experiments/archb_eval_request_contract.py \
              --request "$request_path" \
              --run-dir "$RUNNER_TEMP/unmaterialized-backbone" \
              --out-dir "$eval_dir" > "$pre_resolved"

            artifact_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact_id"])' "$pre_resolved")"
            [[ "$artifact_id" == "14180249360" ]]

            artifact_metadata="$RUNNER_TEMP/archb-artifact-metadata.json"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id" \
              > "$artifact_metadata"

            "$runtime_python" experiments/archb_artifact_transport_contract.py \
              --request "$request_path" \
              --artifact-metadata "$artifact_metadata" \
              > "$RUNNER_TEMP/archb-transport-binding.json"

            archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$artifact_metadata")"
            artifact_zip="$RUNNER_TEMP/archb-backbone-artifact.zip"
            curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$archive_url" \
              -o "$artifact_zip"

            rehydrated="$RUNNER_TEMP/archb-rehydrated"
            mkdir -p "$rehydrated"
            "$runtime_python" experiments/archb_artifact_rehydrate.py \
              --request "$request_path" \
              --artifact-id "$artifact_id" \
              --artifact-zip "$artifact_zip" \
              --destination "$rehydrated" \
              > "$RUNNER_TEMP/archb-rehydrate.json"

            run_dir="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_dir"])' "$RUNNER_TEMP/archb-rehydrate.json")"
            [[ -d "$run_dir" ]]

            resolved="$RUNNER_TEMP/archb-resolved.json"
            "$runtime_python" experiments/archb_eval_request_contract.py \
              --request "$request_path" \
              --run-dir "$run_dir" \
              --out-dir "$eval_dir" > "$resolved"

            mapfile -t eval_args < <(
              python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["evaluator_args"]; assert isinstance(a,list) and a; assert all(isinstance(x,str) and "\n" not in x and "\r" not in x for x in a); print(*a, sep="\n")' "$resolved"
            )

            "$runtime_python" experiments/pa_eval_cross_surrogate_dqnguard.py \
              "${eval_args[@]}"

            [[ -f "$eval_dir/result_record.json" ]]
            python3 - "$eval_dir/result_record.json" "$EXPECTED_SHA" "$request_path" <<'PY'
          import json, pathlib, sys
          path, expected_sha, request_path = sys.argv[1:4]
          d=json.loads(pathlib.Path(path).read_text())
          req=json.loads(pathlib.Path(request_path).read_text())
          assert d["schema"] == "padataset.cross-surrogate-dqnguard-b.result.v1"
          assert d["architecture"] == "B"
          assert d["target_pa"] == "PA2"
          assert d["status"] == "SMALL_REAL"
          assert d["source"]["git_sha"] == expected_sha
          assert d["source"]["cache_len"] == 16384
          assert d["backbone"]["checkpoint_selection"] == "known_only"
          assert d["backbone"]["known_classes"] == ["PA1","PA3","PA4","PA8"]
          assert d["evidence_partition"]["target_quarantined"] is True
          assert d["candidate_selection"]["own_surrogate_diagonal_excluded"] is True
          assert d["score"]["state_mode"] == req["state_mode"]
          assert req["stage"] in {"B0", "B1", "B2", "B3"}
          if req["stage"] == "B1":
              assert req["predeclared_stage_transition"] is True
              assert req["b0_target_metrics_used_for_b1_parameters"] is False
          if req["stage"] == "B2":
              assert req["predeclared_stage_transition"] is True
              assert req["target_metrics_used_for_state_mode_selection"] is False
              assert d["score"]["class_conditional_bands"] is True
              assert d["score"]["band_params"]["candidate_guard_training"] == "own_pseudo_surrogate_only"
              assert d["score"]["band_params"]["composite_score"] == "dqn_margin_plus_guard_cdf"
          if req["stage"] == "B3":
              assert req["predeclared_stage_transition"] is True
              assert req["target_metrics_used_for_b3_trigger_or_tuning"] is False
              assert d["score"]["class_conditional_bands"] is True
              assert d["score"]["tune_band_weights"] is True
              assert d["score"]["band_params"]["guard_weight_rule"] == "bounded_b3_search"
              assert d["score"]["band_params"]["b3_search"]["selection_evidence"] == "off_diagonal_pseudo_open_only"
              assert d["score"]["band_params"]["b3_search"]["dqn_retrained_per_weight"] is False
          assert d["threshold"]["source"] == "known_only"
          assert float(d["threshold"]["budget"]) == 0.05
          p=d["provenance"]
          assert p["target_labels_used_for_fitting"] is False
          assert p["target_labels_used_for_thresholding"] is False
          assert p["target_labels_used_for_candidate_selection"] is False
          assert p["target_first_consumed_after_winner_frozen"] is True
          PY

            cp "$artifact_metadata" "$eval_dir/artifact-metadata.json"
            cp "$RUNNER_TEMP/archb-transport-binding.json" "$eval_dir/artifact-transport-binding.json"
            cp "$RUNNER_TEMP/archb-rehydrate.json" "$eval_dir/rehydration.json"
            cp "$resolved" "$eval_dir/resolved-request.json"
          elif [[ "$OPERATION" == "l2o_directional_eval" ]]; then
            request_path="$CONFIG_PATH"
            matrix_path="manifests/l2o_canonical_backbone_matrix_v1.json"
            policy_path="manifests/l2o_directional_eval_policy_v1.json"
            eval_dir="$result_root/l2o_eval"
            mkdir -p "$eval_dir"

            pre_resolved="$RUNNER_TEMP/l2o-pre-resolved.json"
            "$runtime_python" experiments/l2o_eval_request_contract.py \
              --request "$request_path" \
              --matrix "$matrix_path" \
              --policy "$policy_path" \
              --run-dir "$RUNNER_TEMP/unmaterialized-backbone" \
              --out-dir "$eval_dir" > "$pre_resolved"

            artifact_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact_id"])' "$pre_resolved")"
            canonical_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["canonical_key"])' "$pre_resolved")"
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            [[ "$canonical_key" =~ ^PA(1|2|3|4|8)-PA(1|2|3|4|8)$ ]]

            artifact_metadata="$RUNNER_TEMP/l2o-artifact-metadata.json"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id" \
              > "$artifact_metadata"

            "$runtime_python" experiments/l2o_artifact_transport_contract.py \
              --request "$request_path" \
              --matrix "$matrix_path" \
              --artifact-metadata "$artifact_metadata" \
              > "$RUNNER_TEMP/l2o-transport-binding.json"

            archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$artifact_metadata")"
            artifact_zip="$RUNNER_TEMP/l2o-backbone-artifact.zip"
            curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$archive_url" \
              -o "$artifact_zip"

            rehydrated="$RUNNER_TEMP/l2o-rehydrated"
            mkdir -p "$rehydrated"
            "$runtime_python" experiments/l2o_artifact_rehydrate.py \
              --matrix "$matrix_path" \
              --canonical-key "$canonical_key" \
              --artifact-id "$artifact_id" \
              --artifact-zip "$artifact_zip" \
              --destination "$rehydrated" \
              > "$RUNNER_TEMP/l2o-rehydrate.json"

            run_dir="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_dir"])' "$RUNNER_TEMP/l2o-rehydrate.json")"
            [[ -d "$run_dir" ]]

            resolved="$RUNNER_TEMP/l2o-resolved.json"
            "$runtime_python" experiments/l2o_eval_request_contract.py \
              --request "$request_path" \
              --matrix "$matrix_path" \
              --policy "$policy_path" \
              --run-dir "$run_dir" \
              --out-dir "$eval_dir" > "$resolved"

            mapfile -t eval_args < <(
              python3 -c 'import json,sys; a=json.load(open(sys.argv[1]))["evaluator_args"]; assert isinstance(a,list) and a; assert all(isinstance(x,str) and "\n" not in x and "\r" not in x for x in a); print(*a, sep="\n")' "$resolved"
            )

            "$runtime_python" experiments/pa_eval_dqn_guard_surrogate_open.py \
              "${eval_args[@]}" \
              --data-root "$TRUSTED_DATA"

            [[ -f "$eval_dir/osr_summary.csv" ]]

            "$runtime_python" experiments/l2o_eval_result_record.py \
              --request "$request_path" \
              --matrix "$matrix_path" \
              --policy "$policy_path" \
              --summary-csv "$eval_dir/osr_summary.csv" \
              --output "$eval_dir/result_record.json"

            cp "$artifact_metadata" "$eval_dir/artifact-metadata.json"
            cp "$RUNNER_TEMP/l2o-transport-binding.json" "$eval_dir/artifact-transport-binding.json"
            cp "$RUNNER_TEMP/l2o-rehydrate.json" "$eval_dir/rehydration.json"
            cp "$resolved" "$eval_dir/resolved-request.json"
          else
            normalized="$RUNNER_TEMP/normalized-scientific-config.json"
            python3 - "$CONFIG_PATH" "$TRUSTED_DATA" "$result_root" "$normalized" <<'PY'
          import json, pathlib, sys
          source, trusted_data, result_root, out = sys.argv[1:]
          cfg=json.loads(pathlib.Path(source).read_text())
          cfg["cache_root"]=trusted_data
          cfg["save_root"]=str(pathlib.Path(result_root) / "backbone")
          cfg["skip_cache_build"]=True
          cfg["force_rebuild_cache"]=False
          cfg["overwrite_existing_run"]=False
          cfg["device"]="cuda"
          pathlib.Path(out).write_text(json.dumps(cfg, indent=2, sort_keys=True)+"\n")
          PY

            "$runtime_python" experiments/pa_train_one.py --cfg "$normalized"

            run_dir="$(
              python3 - "$normalized" <<'PY'
          import json, pathlib, sys
          cfg=json.loads(pathlib.Path(sys.argv[1]).read_text())
          save=pathlib.Path(cfg["save_root"])
          if cfg.get("use_timestamped_run_dir", True):
              raise SystemExit("scientific v1 requires use_timestamped_run_dir=false")
          print(save / cfg["run_name"])
          PY
            )"
            [[ -f "$run_dir/config.json" ]]
            [[ -f "$run_dir/best_model.pt" ]]
            [[ -f "$run_dir/summary.json" ]]
            [[ -f "$run_dir/train_complete.json" ]]

            if [[ "$OPERATION" == "stage03_archc" ]]; then
              eval_dir="$result_root/archc_eval"
              "$runtime_python" experiments/pa_eval_multisurrogate_dqnguard.py                 --run-dir "$run_dir"                 --checkpoint best_model                 --out-dir "$eval_dir"                 --device cuda                 --batch-size 128                 --num-workers 0                 --partition-seed 1701                 --dqn-episodes 30                 --known-budget 0.05

              python3 - "$eval_dir/result_record.json" "$EXPECTED_SHA" <<'PY'
          import json, pathlib, sys
          path, expected_sha = sys.argv[1:3]
          d=json.loads(pathlib.Path(path).read_text())
          assert d["schema"] == "padataset.multisurrogate_dqnguard.result.v1"
          assert d["architecture"] == "C"
          assert d["target_pa"] == "PA2"
          assert d["status"] == "SMALL_REAL"
          assert d["source"]["git_sha"] == expected_sha
          assert d["source"]["cache_len"] == 16384
          assert d["backbone"]["checkpoint_selection"] == "known_only"
          assert len(d["backbone"]["known_classes"]) == 4
          assert d["evidence_partition"]["target_quarantined"] is True
          assert d["threshold"]["source"] == "known_only"
          assert d["provenance"]["target_labels_used_for_tuning"] is False
          PY
            fi
          fi

          python3 - "$result_root" "$EXPECTED_SHA" "$OPERATION" "$TRUSTED_DATA" <<'PY'
          import hashlib, json, os, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          expected_sha, operation, trusted_data=sys.argv[2:5]
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for block in iter(lambda:f.read(8*1024*1024), b""):
                          h.update(block)
                  files.append({
                      "path": p.relative_to(root).as_posix(),
                      "bytes": p.stat().st_size,
                      "sha256": h.hexdigest(),
                  })
          receipt={
              "schema":"padataset.scientific-execution-receipt.v1",
              "decision":"PASS",
              "candidate_sha":expected_sha,
              "operation":operation,
              "runtime_id":"padataset-dnns-v1",
              "runtime_path":os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256":os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
              "dataset_profile":"ota_core_high_run01_len16384_v1",
              "trusted_data_root":trusted_data,
              "gpu_uuid":os.environ["P5_GPU_TARGET_UUID"],
              "files":files,
          }
          (root/"scientific-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload scientific results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padataset-scientific-2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scientific-results
            ${{ runner.temp }}/scientific-runtime-smoke.json
          if-no-files-found: error
          retention-days: 30
