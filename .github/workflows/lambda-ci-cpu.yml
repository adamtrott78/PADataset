name: PADataset Lambda CI CPU Canary

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

jobs:
  padataset-cpu:
    name: "${{ format('wc-admission-v1|workload=cpu-ci|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-ci-cpu ')
    runs-on: lambda-padataset-cpu-public
    timeout-minutes: 10

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-ci-cpu SHA" >&2
            exit 20
          }

          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' \
              <<<"$pr_json"
          )"

          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 21
          }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove bounded PADataset CPU runner
        id: preflight
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-padataset" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${XDG_CACHE_HOME:-}" ]]

          runner_dir="$(dirname "$(dirname "$RUNNER_TEMP")")"
          job_dir="$(dirname "$runner_dir")"
          job_root="/srv/workspace-ci/padataset/jobs"
          staging_root="/srv/workspace-ci/padataset/staging-cache"
          staging_dir="$XDG_CACHE_HOME"

          [[ "$job_dir" == "$job_root"/p5-* ]]
          [[ "$staging_dir" == "$staging_root"/p5-* ]]
          [[ -d "$job_dir" ]]
          [[ -d "$staging_dir" ]]

          mapfile -t job_dirs < <(
            find "$job_root" -mindepth 1 -maxdepth 1 -type d -name 'p5-*' -printf '%f\n' | sort
          )
          mapfile -t staging_dirs < <(
            find "$staging_root" -mindepth 1 -maxdepth 1 -type d -name 'p5-*' -printf '%f\n' | sort
          )

          [[ "${#job_dirs[@]}" -eq 1 ]]
          [[ "${#staging_dirs[@]}" -eq 1 ]]
          [[ "${job_dirs[0]}" == "$(basename "$job_dir")" ]]
          [[ "${staging_dirs[0]}" == "$(basename "$staging_dir")" ]]

          if find "$job_root" "$staging_root" -name '.padataset-run4-cpu-marker-*' -print -quit | grep -q .; then
            echo "Stale PADataset CPU marker survived prior cleanup" >&2
            exit 30
          fi

          [[ ! -r /home/atrott ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /srv/workspace-ci/research-engine ]]
          [[ ! -r /var/lib/workspace-ci/provisioner ]]
          [[ ! -r /run/workspace-ci ]]

          if [[ -e /var/run/docker.sock ]]; then
            [[ ! -r /var/run/docker.sock ]]
            [[ ! -w /var/run/docker.sock ]]
          fi

          if timeout 2 bash -c '</dev/tcp/127.0.0.1/5432' 2>/dev/null; then
            echo "Production PostgreSQL reachable from PADataset CPU job" >&2
            exit 31
          fi

          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "PADataset CPU job unexpectedly has NVIDIA access" >&2
            exit 32
          fi

          marker=".padataset-run4-cpu-marker-${GITHUB_RUN_ID}"
          printf '%s\n' "$EXPECTED_SHA" > "$job_dir/$marker"
          printf '%s\n' "$EXPECTED_SHA" > "$staging_dir/$marker"

          {
            echo "runner_name=$RUNNER_NAME"
            echo "job_dir_id=$(basename "$job_dir")"
            echo "staging_dir_id=$(basename "$staging_dir")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Write PADataset CPU canary receipt
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          RUNNER_NAME_VALUE: ${{ steps.preflight.outputs.runner_name }}
          JOB_DIR_ID: ${{ steps.preflight.outputs.job_dir_id }}
          STAGING_DIR_ID: ${{ steps.preflight.outputs.staging_dir_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]

          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "Checkout credentials remained in candidate git config" >&2
            exit 40
          fi

          export ACTUAL_SHA="$actual_sha"
          receipt="$RUNNER_TEMP/padataset-lambda-ci-cpu-receipt.json"
          export RECEIPT_PATH="$receipt"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          payload = {
              "schema_version": 1,
              "phase": "PADataset-Run4-CPU-canary",
              "decision": "PASS",
              "expected_sha": os.environ["EXPECTED_SHA"],
              "actual_sha": os.environ["ACTUAL_SHA"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "runner_name": os.environ["RUNNER_NAME_VALUE"],
              "runner_user": os.environ.get("USER"),
              "uid": os.getuid(),
              "gid": os.getgid(),
              "job_dir_id": os.environ["JOB_DIR_ID"],
              "staging_dir_id": os.environ["STAGING_DIR_ID"],
              "scale_set_target": "lambda-padataset",
              "profile_expected": "cpu-test",
              "research_engine_root_readable": False,
              "personal_home_readable": False,
              "workspace_control_readable": False,
              "provisioner_state_readable": False,
              "workspace_ci_socket_directory_readable": False,
              "docker_access": False,
              "production_postgres_reachable": False,
              "nvidia_visible": False,
              "checkout_credentials_persisted": False,
              "scientific_state_materialized": False,
              "dataset_materialized": False,
              "training_performed": False,
              "evaluation_performed": False,
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload PADataset CPU canary receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padataset-lambda-ci-cpu-receipt
          path: ${{ runner.temp }}/padataset-lambda-ci-cpu-receipt.json
          if-no-files-found: error
          retention-days: 7

  l2o-directional-eval-cpu:
    name: "${{ format('wc-admission-v1|workload=l2o-directional-eval-cpu|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-l2o-eval-cpu ')
    runs-on: lambda-padataset-cpu-public
    timeout-minutes: 120

    steps:
      - name: Post raw CPU evaluator run marker
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$REPOSITORY" "$PR_NUMBER" "$GH_TOKEN" "$COMMENT_BODY" <<'PY'
          import json, os, sys, urllib.request
          repo, pr, token, comment_body=sys.argv[1:]
          payload={
              "marker":"MTH602_CPU_OSR_RAW_START_V1",
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "comment_body":comment_body,
          }
          body="MTH602_CPU_OSR_RAW_START_V1\n\n```json\n"+json.dumps(payload,sort_keys=True)+"\n```"
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr}/comments",
              data=json.dumps({"body":body}).encode(),
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              print(r.status)
          PY

      - name: Verify exact PR head and bounded request
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(printf '%s\n' "$COMMENT_BODY" | awk 'NF{print NF}')" == "3" ]] || {
            echo "CPU evaluator trigger requires exact SHA plus one directional request path" >&2
            exit 20
          }

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          request_path="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $3}')"

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid candidate SHA" >&2
            exit 21
          }
          [[ "$request_path" =~ ^manifests/configs/l2o_directional_eval_v1/[A-Za-z0-9_.-]+\.json$ ]] || {
            echo "Directional request path rejected" >&2
            exit 22
          }

          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"$pr_json")"
          head_repo="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])' <<<"$pr_json")"
          state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<<"$pr_json")"

          [[ "$state" == "open" ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 23
          }

          {
            echo "expected_sha=$expected_sha"
            echo "request_path=$request_path"
          } >> "$GITHUB_OUTPUT"

      - name: Post CPU evaluator start marker
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.gate.outputs.request_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$REPOSITORY" "$PR_NUMBER" "$GH_TOKEN" "$REQUEST_PATH" <<'PY'
          import json, os, sys, urllib.request
          repo, pr, token, request_path=sys.argv[1:]
          payload={
              "marker":"MTH602_CPU_OSR_STARTED_V1",
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "request_path":request_path,
          }
          body="MTH602_CPU_OSR_STARTED_V1\n\n```json\n"+json.dumps(payload,sort_keys=True)+"\n```"
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr}/comments",
              data=json.dumps({"body":body}).encode(),
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              print(r.status)
          PY

      - name: Prove bounded CPU scientific runner
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-padataset" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]

          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "CPU evaluator runner unexpectedly has NVIDIA access" >&2
            exit 30
          fi

          trusted_data="/srv/workspace-ci/padataset/trusted-cache/scientific-data/ota_core_high_run01_len16384_v1"
          [[ -d "$trusted_data" ]]
          [[ -r "$trusted_data/promotion.json" ]]
          [[ ! -w "$trusted_data" ]]
          [[ -n "$(find "$trusted_data" -maxdepth 1 -type f -name '*.h5' -print -quit)" ]]

          python3 - "$trusted_data/promotion.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d["schema"] == "padataset.scientific-data-promotion.v1"
          assert d["profile_id"] == "ota_core_high_run01_len16384_v1"
          assert d["read_only_hardened"] is True
          assert d["cache_len"] == 16384
          assert d["dataset_tag"] == "ota_core_high_run01"
          assert d["noise_tag"] == "high_run01"
          assert int(d["file_count"]) > 0
          PY

          runtime_python="${P5_EXPANDED_RUNTIME_PYTHON:-}"
          if [[ -z "$runtime_python" || ! -x "$runtime_python" ]]; then
            runtime_python="$(command -v python3)"
          fi
          [[ -x "$runtime_python" ]]

          "$runtime_python" - <<'PY'
          import h5py, matplotlib, numpy, pandas, scipy, sklearn, torch
          assert torch.cuda.is_available() is False
          print("CPU_RUNTIME_IMPORTS=PASS")
          print("TORCH_VERSION=" + str(torch.__version__))
          PY

          {
            echo "trusted_data=$trusted_data"
            echo "runtime_python=$runtime_python"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate frozen request and CPU-only override
        id: request
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_PATH: ${{ steps.gate.outputs.request_path }}
          RUNTIME_PYTHON: ${{ steps.preflight.outputs.runtime_python }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          matrix_path="manifests/l2o_canonical_backbone_matrix_v1.json"
          policy_path="manifests/l2o_directional_eval_policy_v1.json"
          out_dir="$RUNNER_TEMP/l2o-cpu-eval"
          mkdir -p "$out_dir"

          pre_resolved="$RUNNER_TEMP/l2o-pre-resolved.json"
          "$RUNTIME_PYTHON" experiments/l2o_eval_request_contract.py \
            --request "$REQUEST_PATH" \
            --matrix "$matrix_path" \
            --policy "$policy_path" \
            --run-dir "$RUNNER_TEMP/unmaterialized-backbone" \
            --out-dir "$out_dir" > "$pre_resolved"

          "$RUNTIME_PYTHON" - "$pre_resolved" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text())
          args=list(d["evaluator_args"])
          i=args.index("--device")
          assert args[i+1] == "cuda", args
          args[i+1] = "cpu"
          d["evaluator_args_cpu"] = args
          d["reference_evaluator_device"] = "cuda"
          d["executed_evaluator_device"] = "cpu"
          p.write_text(json.dumps(d, indent=2, sort_keys=True)+"\n")
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write(f'artifact_id={int(d["artifact_id"])}\n')
              out.write(f'canonical_key={d["canonical_key"]}\n')
              out.write(f'evaluation_target={d["evaluation_target"]}\n')
              out.write(f'evaluation_surrogate={d["evaluation_surrogate"]}\n')
          PY

      - name: Rehydrate exact backbone and execute CPU diagnostic
        id: eval
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_PATH: ${{ steps.gate.outputs.request_path }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          CANONICAL_KEY: ${{ steps.request.outputs.canonical_key }}
          EVALUATION_TARGET: ${{ steps.request.outputs.evaluation_target }}
          EVALUATION_SURROGATE: ${{ steps.request.outputs.evaluation_surrogate }}
          RUNTIME_PYTHON: ${{ steps.preflight.outputs.runtime_python }}
          TRUSTED_DATA: ${{ steps.preflight.outputs.trusted_data }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          result_root="$RUNNER_TEMP/cpu-osr-results"
          eval_dir="$result_root/l2o_eval"
          mkdir -p "$eval_dir"

          matrix_path="manifests/l2o_canonical_backbone_matrix_v1.json"
          policy_path="manifests/l2o_directional_eval_policy_v1.json"

          artifact_metadata="$RUNNER_TEMP/l2o-artifact-metadata.json"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$artifact_metadata"

          "$RUNTIME_PYTHON" experiments/l2o_artifact_transport_contract.py \
            --request "$REQUEST_PATH" \
            --matrix "$matrix_path" \
            --artifact-metadata "$artifact_metadata" \
            > "$RUNNER_TEMP/l2o-transport-binding.json"

          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$artifact_metadata")"
          artifact_zip="$RUNNER_TEMP/l2o-backbone-artifact.zip"
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$archive_url" \
            -o "$artifact_zip"

          rehydrated="$RUNNER_TEMP/l2o-rehydrated"
          mkdir -p "$rehydrated"
          "$RUNTIME_PYTHON" experiments/l2o_artifact_rehydrate.py \
            --matrix "$matrix_path" \
            --canonical-key "$CANONICAL_KEY" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-zip "$artifact_zip" \
            --destination "$rehydrated" \
            > "$RUNNER_TEMP/l2o-rehydrate.json"

          run_dir="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_dir"])' "$RUNNER_TEMP/l2o-rehydrate.json")"
          [[ -d "$run_dir" ]]

          resolved="$RUNNER_TEMP/l2o-resolved-cpu.json"
          "$RUNTIME_PYTHON" experiments/l2o_eval_request_contract.py \
            --request "$REQUEST_PATH" \
            --matrix "$matrix_path" \
            --policy "$policy_path" \
            --run-dir "$run_dir" \
            --out-dir "$eval_dir" > "$resolved"

          "$RUNTIME_PYTHON" - "$resolved" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text())
          args=list(d["evaluator_args"])
          i=args.index("--device")
          assert args[i+1] == "cuda"
          args[i+1] = "cpu"
          d["evaluator_args_cpu"] = args
          d["reference_evaluator_device"] = "cuda"
          d["executed_evaluator_device"] = "cpu"
          p.write_text(json.dumps(d, indent=2, sort_keys=True)+"\n")
          PY

          mapfile -t eval_args < <(
            "$RUNTIME_PYTHON" - "$resolved" <<'PY'
          import json, sys
          a=json.load(open(sys.argv[1]))["evaluator_args_cpu"]
          assert isinstance(a,list) and a
          assert all(isinstance(x,str) and "\n" not in x and "\r" not in x for x in a)
          print(*a,sep="\n")
          PY
          )

          "$RUNTIME_PYTHON" experiments/pa_eval_dqn_guard_surrogate_open.py \
            "${eval_args[@]}" \
            --data-root "$TRUSTED_DATA"

          [[ -f "$eval_dir/osr_summary.csv" ]]

          "$RUNTIME_PYTHON" experiments/l2o_eval_result_record.py \
            --request "$REQUEST_PATH" \
            --matrix "$matrix_path" \
            --policy "$policy_path" \
            --summary-csv "$eval_dir/osr_summary.csv" \
            --output "$eval_dir/result_record.json"

          cp "$artifact_metadata" "$eval_dir/artifact-metadata.json"
          cp "$RUNNER_TEMP/l2o-transport-binding.json" "$eval_dir/artifact-transport-binding.json"
          cp "$RUNNER_TEMP/l2o-rehydrate.json" "$eval_dir/rehydration.json"
          cp "$resolved" "$eval_dir/resolved-request-cpu.json"

          "$RUNTIME_PYTHON" - "$eval_dir/result_record.json" "$eval_dir/cpu-equivalence-receipt.json" "$EXPECTED_SHA" <<'PY'
          import json, pathlib, sys
          src,out,sha=sys.argv[1:]
          d=json.loads(pathlib.Path(src).read_text())
          receipt={
              "schema":"padataset.l2o-cpu-equivalence-diagnostic.v1",
              "candidate_sha":sha,
              "reference_policy_id":"l2o_dqnguard_track_a_frozen_v1",
              "reference_evaluator_device":"cuda",
              "executed_evaluator_device":"cpu",
              "equivalence_status":"PENDING_SAME_BACKBONE_CUDA_REFERENCE",
              "target_labels_used_for_tuning":False,
              "result_record":d,
          }
          pathlib.Path(out).write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

          "$RUNTIME_PYTHON" - "$eval_dir/result_record.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          def get(*keys):
              cur=d
              for k in keys:
                  if not isinstance(cur,dict) or k not in cur:
                      return None
                  cur=cur[k]
              return cur
          candidates={
              "unknown_f1": [
                  ("metrics","unknown_f1"),
                  ("unknown_f1",),
              ],
              "unknown_auroc": [
                  ("metrics","unknown_auroc"),
                  ("unknown_auroc",),
              ],
              "known_reject_rate": [
                  ("metrics","known_reject_rate"),
                  ("known_reject_rate",),
              ],
          }
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              for name,paths in candidates.items():
                  val=None
                  for p in paths:
                      val=get(*p)
                      if val is not None: break
                  out.write(f"{name}={'' if val is None else val}\n")
          PY

      - name: Upload CPU OSR diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padataset-l2o-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/cpu-osr-results
          if-no-files-found: error
          retention-days: 30

      - name: Post CPU diagnostic result
        if: success()
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.request.outputs.evaluation_target }}
          SURROGATE: ${{ steps.request.outputs.evaluation_surrogate }}
          UNKNOWN_F1: ${{ steps.eval.outputs.unknown_f1 }}
          UNKNOWN_AUROC: ${{ steps.eval.outputs.unknown_auroc }}
          KNOWN_REJECT_RATE: ${{ steps.eval.outputs.known_reject_rate }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$(
            python3 - <<'PY'
          import json, os
          direction=f'{os.environ["TARGET"]}<-{os.environ["SURROGATE"]}'
          payload={
              "marker":"MTH602_CPU_OSR_RESULT_V1",
              "direction":direction,
              "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "workflow_job":"l2o-directional-eval-cpu",
              "unknown_f1":os.environ.get("UNKNOWN_F1") or None,
              "unknown_auroc":os.environ.get("UNKNOWN_AUROC") or None,
              "known_reject_rate":os.environ.get("KNOWN_REJECT_RATE") or None,
              "executed_evaluator_device":"cpu",
              "reference_evaluator_device":"cuda",
              "equivalence_status":"PENDING_SAME_BACKBONE_CUDA_REFERENCE",
          }
          print("MTH602_CPU_OSR_RESULT_V1\n\n```json")
          print(json.dumps(payload,sort_keys=True))
          print("```")
          PY
          )"
          python3 - "$REPOSITORY" "$PR_NUMBER" "$GH_TOKEN" "$body" <<'PY'
          import json, os, sys, urllib.request
          repo, pr, token, body=sys.argv[1:]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr}/comments",
              data=json.dumps({"body":body}).encode(),
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              print(r.status)
          PY
