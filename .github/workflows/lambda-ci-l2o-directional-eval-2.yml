name: PADataset L2O Directional Eval GPU 2

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  l2o-directional-eval-2:
    name: "${{ format('wc-admission-v1|workload=l2o-directional-eval-2|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-l2o-eval-2 ')
    runs-on: lambda-padataset-scientific-single-gpu-2
    timeout-minutes: 120

    steps:
      - name: Verify exact PR head and frozen request path
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(printf '%s\n' "$COMMENT_BODY" | awk 'NF{print NF}')" == "3" ]] || {
            echo "L2O evaluator trigger requires exact SHA plus one frozen request path" >&2
            exit 21
          }

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          request_path="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $3}')"

          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid candidate SHA" >&2
            exit 20
          }
          [[ "$request_path" =~ ^manifests/configs/l2o_directional_eval_v1/[A-Za-z0-9_.-]+\.json$ ]] || {
            echo "Frozen directional request path rejected" >&2
            exit 23
          }

          pr_json="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])' <<<"$pr_json")"
          head_repo="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])' <<<"$pr_json")"
          state="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])' <<<"$pr_json")"

          [[ "$state" == "open" ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 22
          }

          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "request_path=$request_path" >> "$GITHUB_OUTPUT"

      - name: Prove isolated GPU2 scientific runner
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-padataset-2" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${P5_GPU_TARGET_UUID:-}" ]]
          [[ "$P5_GPU_TARGET_UUID" == "GPU-cfed3394-a935-63aa-9325-c4cae7b568b6" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "$P5_GPU_TARGET_UUID" ]]

          [[ -n "${P5_EXPANDED_RUNTIME:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_PYTHON:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" ]]
          [[ -x "$P5_EXPANDED_RUNTIME_PYTHON" ]]
          [[ -r "$P5_EXPANDED_RUNTIME" ]]
          [[ ! -w "$P5_EXPANDED_RUNTIME" ]]

          trusted_data="/srv/workspace-ci/padataset/trusted-cache/scientific-data/ota_core_high_run01_len16384_v1"
          [[ -d "$trusted_data" ]]
          [[ -r "$trusted_data/promotion.json" ]]
          [[ ! -w "$trusted_data" ]]
          [[ -n "$(find "$trusted_data" -maxdepth 1 -type f -name '*.h5' -print -quit)" ]]

          python3 - "$trusted_data/promotion.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d["schema"] == "padataset.scientific-data-promotion.v1"
          assert d["profile_id"] == "ota_core_high_run01_len16384_v1"
          assert d["read_only_hardened"] is True
          assert d["cache_len"] == 16384
          assert d["dataset_tag"] == "ota_core_high_run01"
          assert d["noise_tag"] == "high_run01"
          assert int(d["file_count"]) > 0
          PY

          [[ ! -r /home/atrott ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /srv/workspace-ci/research-engine ]]
          [[ ! -r /var/lib/workspace-ci/provisioner ]]
          [[ ! -r /run/workspace-ci ]]
          if [[ -e /var/run/docker.sock ]]; then
            [[ ! -r /var/run/docker.sock ]]
            [[ ! -w /var/run/docker.sock ]]
          fi

          echo "trusted_data=$trusted_data" >> "$GITHUB_OUTPUT"

      - name: Checkout exact evaluator candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate frozen directional request
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_PATH: ${{ steps.gate.outputs.request_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ -f "$REQUEST_PATH" ]]
          [[ ! -L "$REQUEST_PATH" ]]

          python3 - "$REQUEST_PATH" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]).resolve()
          root=pathlib.Path.cwd().resolve()
          allowed=(root/"manifests"/"configs"/"l2o_directional_eval_v1").resolve()
          p.relative_to(allowed)
          d=json.loads(p.read_text())
          assert d["schema"] == "padataset.l2o-directional-eval-request.v1"
          assert d["status"] == "READY_FOR_BOUNDED_EVALUATOR"
          assert d["policy_id"] == "l2o_dqnguard_track_a_frozen_v1"
          assert d["canonical_matrix"] == "manifests/l2o_canonical_backbone_matrix_v1.json"
          assert d["evaluation_policy"] == "manifests/l2o_directional_eval_policy_v1.json"
          assert d["checkpoint"] == "best_model"
          assert d["target_labels_used_for_tuning"] is False
          PY

      - name: Execute frozen directional evaluator
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_PATH: ${{ steps.gate.outputs.request_path }}
          TRUSTED_DATA: ${{ steps.preflight.outputs.trusted_data }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          runtime_python="$P5_EXPANDED_RUNTIME_PYTHON"
          result_root="$RUNNER_TEMP/l2o-directional-results"
          eval_dir="$result_root/eval"
          matrix_path="manifests/l2o_canonical_backbone_matrix_v1.json"
          policy_path="manifests/l2o_directional_eval_policy_v1.json"
          mkdir -p "$eval_dir"

          "$runtime_python" - <<'PY'
          import json, os, pathlib
          import h5py, matplotlib, numpy, pandas, scipy, sklearn, torch
          payload = {
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_device_count": int(torch.cuda.device_count()),
              "cuda_device_name": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "runtime": os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256": os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
          }
          if not payload["cuda_available"] or payload["cuda_device_count"] != 1:
              raise SystemExit(f"scientific runtime GPU gate failed: {payload}")
          pathlib.Path(os.environ["RUNNER_TEMP"], "l2o-runtime-smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

          pre_resolved="$RUNNER_TEMP/l2o-pre-resolved.json"
          "$runtime_python" experiments/l2o_eval_request_contract.py             --request "$REQUEST_PATH"             --matrix "$matrix_path"             --policy "$policy_path"             --run-dir "$RUNNER_TEMP/unmaterialized-backbone"             --out-dir "$eval_dir" > "$pre_resolved"

          artifact_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact_id"])' "$pre_resolved")"
          canonical_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["canonical_key"])' "$pre_resolved")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$canonical_key" =~ ^PA(1|2|3|4|8)-PA(1|2|3|4|8)$ ]]

          artifact_metadata="$RUNNER_TEMP/l2o-artifact-metadata.json"
          curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id"             > "$artifact_metadata"

          "$runtime_python" experiments/l2o_artifact_transport_contract.py             --request "$REQUEST_PATH"             --matrix "$matrix_path"             --artifact-metadata "$artifact_metadata"             > "$RUNNER_TEMP/l2o-transport-binding.json"

          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive_download_url"])' "$artifact_metadata")"
          artifact_zip="$RUNNER_TEMP/l2o-backbone-artifact.zip"
          curl -fL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$archive_url"             -o "$artifact_zip"

          rehydrated="$RUNNER_TEMP/l2o-rehydrated"
          mkdir -p "$rehydrated"
          "$runtime_python" experiments/l2o_artifact_rehydrate.py             --matrix "$matrix_path"             --canonical-key "$canonical_key"             --artifact-id "$artifact_id"             --artifact-zip "$artifact_zip"             --destination "$rehydrated"             > "$RUNNER_TEMP/l2o-rehydrate.json"

          run_dir="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_dir"])' "$RUNNER_TEMP/l2o-rehydrate.json")"
          [[ -d "$run_dir" ]]

          resolved="$RUNNER_TEMP/l2o-resolved.json"
          "$runtime_python" experiments/l2o_eval_request_contract.py             --request "$REQUEST_PATH"             --matrix "$matrix_path"             --policy "$policy_path"             --run-dir "$run_dir"             --out-dir "$eval_dir" > "$resolved"

          mapfile -t eval_args < <(
            python3 - "$resolved" <<'PY'
          import json, sys
          args=json.load(open(sys.argv[1]))["evaluator_args"]
          if not isinstance(args, list) or not args:
              raise SystemExit("resolved evaluator args missing")
          for arg in args:
              if not isinstance(arg, str) or "\n" in arg or "\r" in arg:
                  raise SystemExit("invalid evaluator argument")
              print(arg)
          PY
          )

          "$runtime_python" experiments/pa_eval_dqn_guard_surrogate_open.py             "${eval_args[@]}"             --data-root "$TRUSTED_DATA"

          [[ -f "$eval_dir/osr_summary.csv" ]]

          "$runtime_python" experiments/l2o_eval_result_record.py             --request "$REQUEST_PATH"             --matrix "$matrix_path"             --policy "$policy_path"             --summary-csv "$eval_dir/osr_summary.csv"             --output "$eval_dir/result_record.json"

          cp "$artifact_metadata" "$eval_dir/artifact-metadata.json"
          cp "$RUNNER_TEMP/l2o-transport-binding.json" "$eval_dir/artifact-transport-binding.json"
          cp "$RUNNER_TEMP/l2o-rehydrate.json" "$eval_dir/rehydration.json"
          cp "$resolved" "$eval_dir/resolved-request.json"

          python3 - "$result_root" "$EXPECTED_SHA" "$REQUEST_PATH" "$TRUSTED_DATA" <<'PY'
          import hashlib, json, os, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          expected_sha, request_path, trusted_data=sys.argv[2:5]
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for block in iter(lambda:f.read(8*1024*1024), b""):
                          h.update(block)
                  files.append({
                      "path": p.relative_to(root).as_posix(),
                      "bytes": p.stat().st_size,
                      "sha256": h.hexdigest(),
                  })
          receipt={
              "schema":"padataset.scientific-execution-receipt.v1",
              "decision":"PASS",
              "candidate_sha":expected_sha,
              "operation":"l2o_directional_eval",
              "request_path":request_path,
              "runtime_id":"padataset-dnns-v1",
              "runtime_path":os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256":os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
              "dataset_profile":"ota_core_high_run01_len16384_v1",
              "trusted_data_root":trusted_data,
              "gpu_uuid":os.environ["P5_GPU_TARGET_UUID"],
              "files":files,
          }
          (root/"scientific-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          PY

      - name: Upload directional evaluator result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padataset-l2o-eval-2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/l2o-directional-results
            ${{ runner.temp }}/l2o-runtime-smoke.json
          if-no-files-found: error
          retention-days: 30
