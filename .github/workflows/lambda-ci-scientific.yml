name: PADataset Lambda Scientific Single GPU

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  padataset-scientific:
    name: "${{ format('wc-admission-v1|workload=scientific-single-gpu|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lambda-scientific ')
    runs-on: lambda-padataset-scientific-single-gpu
    timeout-minutes: 240

    steps:
      - name: Verify exact PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /lambda-scientific SHA" >&2
            exit 20
          }
          [[ "$(printf '%s\n' "$COMMENT_BODY" | awk 'NF{print NF}')" == "3" ]] || {
            echo "Scientific trigger requires exact SHA plus one bounded request token" >&2
            exit 21
          }
          request_token="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $3}')"
          if [[ "$request_token" != "smoke" ]] &&
             [[ ! "$request_token" =~ ^train_backbone:manifests/configs/[A-Za-z0-9_./-]+\.json$ ]] &&
             [[ ! "$request_token" =~ ^stage03_archc:manifests/configs/[A-Za-z0-9_./-]+\.json$ ]]; then
            echo "Scientific request token rejected" >&2
            exit 23
          fi

          pr_json="$(
            curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"

          actual_sha="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])'               <<<"$pr_json"
          )"
          head_repo="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])'               <<<"$pr_json"
          )"
          state="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])'               <<<"$pr_json"
          )"

          [[ "$state" == "open" ]]
          [[ "$head_repo" == "$REPOSITORY" ]]
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 22
          }
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "request_token=$request_token" >> "$GITHUB_OUTPUT"

      - name: Prove bounded scientific runner
        id: preflight
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$(id -un)" == "ci-padataset" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${P5_GPU_TARGET_UUID:-}" ]]
          [[ "${P5_GPU_TARGET_UUID}" == "GPU-a333e68b-d1dc-6d25-1678-97b527bf55ea" ]]
          [[ "${CUDA_VISIBLE_DEVICES:-}" == "$P5_GPU_TARGET_UUID" ]]

          [[ -n "${P5_EXPANDED_RUNTIME:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_PYTHON:-}" ]]
          [[ -n "${P5_EXPANDED_RUNTIME_TREE_SHA256:-}" ]]
          [[ -x "$P5_EXPANDED_RUNTIME_PYTHON" ]]
          [[ -r "$P5_EXPANDED_RUNTIME" ]]
          [[ ! -w "$P5_EXPANDED_RUNTIME" ]]

          trusted_data="/srv/workspace-ci/padataset/trusted-cache/scientific-data/ota_core_high_run01_len16384_v1"
          [[ -d "$trusted_data" ]]
          [[ -r "$trusted_data/promotion.json" ]]
          [[ ! -w "$trusted_data" ]]
          [[ -n "$(find "$trusted_data" -maxdepth 1 -type f -name '*.h5' -print -quit)" ]]

          python3 - "$trusted_data/promotion.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text())
          assert d["schema"] == "padataset.scientific-data-promotion.v1"
          assert d["profile_id"] == "ota_core_high_run01_len16384_v1"
          assert d["read_only_hardened"] is True
          assert d["cache_len"] == 16384
          assert d["dataset_tag"] == "ota_core_high_run01"
          assert d["noise_tag"] == "high_run01"
          assert int(d["file_count"]) > 0
          PY

          [[ ! -r /home/atrott ]]
          [[ ! -r /home/atrott/.ssh ]]
          [[ ! -r /home/atrott/adamArchives/Adam/workspace-control ]]
          [[ ! -r /srv/workspace-ci/research-engine ]]
          [[ ! -r /var/lib/workspace-ci/provisioner ]]
          [[ ! -r /run/workspace-ci ]]
          if [[ -e /var/run/docker.sock ]]; then
            [[ ! -r /var/run/docker.sock ]]
            [[ ! -w /var/run/docker.sock ]]
          fi

          echo "trusted_data=$trusted_data" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Validate bounded scientific request
        id: request
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          REQUEST_TOKEN: ${{ steps.gate.outputs.request_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          python3 - "$EXPECTED_SHA" "$REQUEST_TOKEN" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys

          expected_sha, request_token, output_path = sys.argv[1:4]
          if not re.fullmatch(r"[0-9a-f]{40}", expected_sha):
              raise SystemExit("scientific candidate SHA invalid")

          if request_token == "smoke":
              op = "smoke"
              config_path = ""
          elif ":" in request_token:
              op, config_path = request_token.split(":", 1)
              if op not in {"train_backbone", "stage03_archc"}:
                  raise SystemExit(f"unsupported scientific operation: {op!r}")
              if not re.fullmatch(
                  r"manifests/configs/[A-Za-z0-9_./-]+\.json", config_path
              ):
                  raise SystemExit("config path rejected")
              root = pathlib.Path.cwd().resolve()
              resolved = (root / config_path).resolve()
              try:
                  resolved.relative_to(root / "manifests" / "configs")
              except ValueError:
                  raise SystemExit("config path escape")
              if not resolved.is_file() or resolved.is_symlink():
                  raise SystemExit("config is not a regular repository file")
              cfg = json.loads(resolved.read_text())
              if cfg.get("skip_cache_build") is not True:
                  raise SystemExit("scientific config must use an existing trusted cache")
              if cfg.get("force_rebuild_cache") is not False:
                  raise SystemExit("scientific config may not rebuild cache")
              if int(cfg.get("cache_len", -1)) != 16384:
                  raise SystemExit("scientific v1 requires cache_len=16384")
              if cfg.get("source_type") != "ota":
                  raise SystemExit("scientific v1 requires OTA source")
              if cfg.get("source_name") != "ota_core_high_run01":
                  raise SystemExit("source_name mismatch")
              if cfg.get("dataset_tag") != "ota_core_high_run01":
                  raise SystemExit("dataset_tag mismatch")
              if cfg.get("noise_tag") != "high_run01":
                  raise SystemExit("noise_tag mismatch")

              if op == "stage03_archc":
                  if cfg.get("unknown_pas") != ["PA2"]:
                      raise SystemExit("Stage 03 v1 requires PA2 target")
                  if set(cfg.get("pas") or []) != {"PA1","PA2","PA3","PA4","PA8"}:
                      raise SystemExit("Stage 03 v1 requires five-PA taxonomy")
                  if cfg.get("early_stopping_mode") != "known_only":
                      raise SystemExit("Stage 03 v1 requires known-only checkpoint selection")
                  if cfg.get("quarantine_target_until_test") is not True:
                      raise SystemExit("Stage 03 v1 requires target quarantine")
                  if float(cfg.get("open_val_frac", -1)) != 0.0:
                      raise SystemExit("Stage 03 v1 requires zero target-open validation")
          else:
              raise SystemExit("scientific request token rejected")

          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"operation={op}\n")
              out.write(f"config_path={config_path}\n")
          PY

      - name: Execute bounded scientific request
        id: scientific
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          OPERATION: ${{ steps.request.outputs.operation }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
          TRUSTED_DATA: ${{ steps.preflight.outputs.trusted_data }}
        shell: bash
        run: |
          set -Eeuo pipefail

          runtime_python="$P5_EXPANDED_RUNTIME_PYTHON"
          result_root="$RUNNER_TEMP/scientific-results"
          mkdir -p "$result_root"

          "$runtime_python" - <<'PY'
          import json, os, pathlib
          import h5py, matplotlib, numpy, pandas, scipy, sklearn, torch
          payload = {
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "cuda_available": bool(torch.cuda.is_available()),
              "cuda_device_count": int(torch.cuda.device_count()),
              "cuda_device_name": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "runtime": os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256": os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
          }
          if not payload["cuda_available"] or payload["cuda_device_count"] != 1:
              raise SystemExit(f"scientific runtime GPU gate failed: {payload}")
          pathlib.Path(os.environ["RUNNER_TEMP"], "scientific-runtime-smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          if [[ "$OPERATION" == "smoke" ]]; then
            cp "$RUNNER_TEMP/scientific-runtime-smoke.json" "$result_root/runtime-smoke.json"
          else
            normalized="$RUNNER_TEMP/normalized-scientific-config.json"
            python3 - "$CONFIG_PATH" "$TRUSTED_DATA" "$result_root" "$normalized" <<'PY'
          import json, pathlib, sys
          source, trusted_data, result_root, out = sys.argv[1:]
          cfg=json.loads(pathlib.Path(source).read_text())
          cfg["cache_root"]=trusted_data
          cfg["save_root"]=str(pathlib.Path(result_root) / "backbone")
          cfg["skip_cache_build"]=True
          cfg["force_rebuild_cache"]=False
          cfg["overwrite_existing_run"]=False
          cfg["device"]="cuda"
          pathlib.Path(out).write_text(json.dumps(cfg, indent=2, sort_keys=True)+"\n")
          PY

            run_dir="$(
              python3 - "$normalized" <<'PY'
          import json, pathlib, sys
          cfg=json.loads(pathlib.Path(sys.argv[1]).read_text())
          save=pathlib.Path(cfg["save_root"])
          if cfg.get("use_timestamped_run_dir", True):
              raise SystemExit("scientific v1 requires use_timestamped_run_dir=false")
          print(save / cfg["run_name"])
          PY
            )"

            emit_scientific_progress() {
              local label="$1"
              local progress_file="$2"
              python3 - "$label" "$progress_file" <<'PY'
          import json, pathlib, sys
          label, raw_path = sys.argv[1:3]
          path = pathlib.Path(raw_path)
          if not path.is_file():
              raise SystemExit(0)
          try:
              d = json.loads(path.read_text())
          except Exception:
              raise SystemExit(0)

          phase = str(d.get("phase", "unknown"))
          parts = [f"lane={label}", f"phase={phase}"]
          if "epoch" in d and "epochs" in d:
              parts.append(f"epoch={d['epoch']}/{d['epochs']}")
          if "step" in d and "steps" in d:
              parts.append(f"step={d['step']}/{d['steps']}")
          if "pct" in d:
              try:
                  parts.append(f"pct={float(d['pct']):.1f}%")
              except Exception:
                  pass
          if "steps_per_sec" in d:
              try:
                  parts.append(f"steps_per_sec={float(d['steps_per_sec']):.2f}")
              except Exception:
                  pass
          if "dqn_episode" in d and "dqn_episodes" in d:
              parts.append(f"dqn_episode={d['dqn_episode']}/{d['dqn_episodes']}")
          if "dqn_avg_reward" in d and d["dqn_avg_reward"] is not None:
              parts.append(f"dqn_reward={float(d['dqn_avg_reward']):.4f}")
          if "dqn_avg_loss" in d and d["dqn_avg_loss"] is not None:
              parts.append(f"dqn_loss={float(d['dqn_avg_loss']):.4f}")
          if "dqn_epsilon" in d:
              parts.append(f"epsilon={float(d['dqn_epsilon']):.4f}")
          print(" | ".join(parts))
          PY
            }

            run_with_scientific_progress() {
              local label="$1"
              local progress_file="$2"
              shift 2
              "$@" &
              local child_pid=$!
              local last_progress=""
              while kill -0 "$child_pid" 2>/dev/null; do
                local current_progress=""
                current_progress="$(emit_scientific_progress "$label" "$progress_file" 2>/dev/null || true)"
                if [[ -n "$current_progress" && "$current_progress" != "$last_progress" ]]; then
                  echo "::notice title=Scientific progress::$current_progress"
                  last_progress="$current_progress"
                fi
                sleep 30
              done

              set +e
              wait "$child_pid"
              local child_rc=$?
              set -e

              local final_progress=""
              final_progress="$(emit_scientific_progress "$label" "$progress_file" 2>/dev/null || true)"
              if [[ -n "$final_progress" && "$final_progress" != "$last_progress" ]]; then
                echo "::notice title=Scientific progress::$final_progress"
              fi
              if (( child_rc != 0 )); then
                echo "::error title=Scientific process failed::lane=$label rc=$child_rc"
                return "$child_rc"
              fi
            }

            train_progress="$run_dir/train_progress.json"
            run_with_scientific_progress               "backbone"               "$train_progress"               "$runtime_python" experiments/pa_train_one.py --cfg "$normalized"

            [[ -f "$run_dir/config.json" ]]
            [[ -f "$run_dir/best_model.pt" ]]
            [[ -f "$run_dir/summary.json" ]]
            [[ -f "$run_dir/train_complete.json" ]]

            if [[ "$OPERATION" == "stage03_archc" ]]; then
              eval_dir="$result_root/archc_eval"
              osr_progress="$result_root/osr_progress.json"
              python3 - "$osr_progress" <<'PY'
          import json, pathlib, sys, time
          path=pathlib.Path(sys.argv[1])
          path.write_text(json.dumps({
              "phase": "evaluation_start",
              "pct": 0.0,
              "time": time.strftime("%Y-%m-%dT%H:%M:%S%z"),
          }, indent=2) + "\n")
          PY
              PADATASET_OSR_PROGRESS_JSON="$osr_progress"                 run_with_scientific_progress                   "architecture_c"                   "$osr_progress"                   "$runtime_python" experiments/pa_eval_multisurrogate_dqnguard.py                     --run-dir "$run_dir"                     --checkpoint best_model                     --out-dir "$eval_dir"                     --device cuda                     --batch-size 128                     --num-workers 0                     --partition-seed 1701                     --dqn-episodes 30                     --known-budget 0.05
              python3 - "$osr_progress" <<'PY'
          import json, pathlib, sys, time
          path=pathlib.Path(sys.argv[1])
          current={}
          if path.is_file():
              try:
                  current=json.loads(path.read_text())
              except Exception:
                  current={}
          current.update({
              "phase": "evaluation_complete",
              "pct": 100.0,
              "time": time.strftime("%Y-%m-%dT%H:%M:%S%z"),
          })
          path.write_text(json.dumps(current, indent=2) + "\n")
          PY
              echo "::notice title=Scientific progress::$(emit_scientific_progress architecture_c "$osr_progress")"

              python3 - "$eval_dir/result_record.json" "$EXPECTED_SHA" <<'PY'
          import json, pathlib, sys
          path, expected_sha = sys.argv[1:3]
          d=json.loads(pathlib.Path(path).read_text())
          assert d["schema"] == "padataset.multisurrogate_dqnguard.result.v1"
          assert d["architecture"] == "C"
          assert d["target_pa"] == "PA2"
          assert d["status"] == "SMALL_REAL"
          assert d["source"]["git_sha"] == expected_sha
          assert d["source"]["cache_len"] == 16384
          assert d["backbone"]["checkpoint_selection"] == "known_only"
          assert len(d["backbone"]["known_classes"]) == 4
          assert d["evidence_partition"]["target_quarantined"] is True
          assert d["threshold"]["source"] == "known_only"
          assert d["provenance"]["target_labels_used_for_tuning"] is False
          PY
            fi
          fi

          python3 - "$result_root" "$EXPECTED_SHA" "$OPERATION" "$TRUSTED_DATA" <<'PY'
          import hashlib, json, os, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          expected_sha, operation, trusted_data=sys.argv[2:5]
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for block in iter(lambda:f.read(8*1024*1024), b""):
                          h.update(block)
                  files.append({
                      "path": p.relative_to(root).as_posix(),
                      "bytes": p.stat().st_size,
                      "sha256": h.hexdigest(),
                  })
          receipt={
              "schema":"padataset.scientific-execution-receipt.v1",
              "decision":"PASS",
              "candidate_sha":expected_sha,
              "operation":operation,
              "runtime_id":"padataset-dnns-v1",
              "runtime_path":os.environ["P5_EXPANDED_RUNTIME"],
              "runtime_tree_sha256":os.environ["P5_EXPANDED_RUNTIME_TREE_SHA256"],
              "dataset_profile":"ota_core_high_run01_len16384_v1",
              "trusted_data_root":trusted_data,
              "gpu_uuid":os.environ["P5_GPU_TARGET_UUID"],
              "files":files,
          }
          (root/"scientific-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Upload scientific results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: padataset-scientific-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scientific-results
            ${{ runner.temp }}/scientific-runtime-smoke.json
          if-no-files-found: error
          retention-days: 30
