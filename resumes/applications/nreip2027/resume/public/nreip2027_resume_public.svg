  <text x="55.00" y="639.20" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Designed and graded practical cybersecurity assignments involving risk analysis, cryptography, WebGoat SQL injection, and</text>
  <text x="55.00" y="649.65" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Burp Suite access-control/authentication attacks.</text>
