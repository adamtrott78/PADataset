  <circle cx="44.00" cy="599.15" r="1.65" fill="#111111"/>
  <text x="55.00" y="601.85" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Led backend development and project management for a university team building a file-storage, viewing, and search system for</text>
  <text x="55.00" y="612.30" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">a NUWC Newport client; coordinated technical work and delivery with the client.</text>
  <text x="38.00" y="626.55" font-family="Liberation Sans" font-size="9.60" font-weight="700" font-style="normal" fill="#111111" text-anchor="start">Teaching Assistant - Cyber Defense and Operations - University of Massachusetts Dartmouth | Jan.-May 2026</text>
