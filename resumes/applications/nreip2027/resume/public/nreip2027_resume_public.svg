  <text x="139.88" y="517.85" font-family="Liberation Sans" font-size="8.90" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">software-defined radio (SDR), RF signal analysis, complex I/Q, FFT, DCT, and polar representations;</text>
  <text x="38.00" y="527.80" font-family="Liberation Sans" font-size="8.90" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">over-the-air WiFi, Bluetooth, and Zigbee data workflows</text>
