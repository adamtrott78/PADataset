  <text x="55.00" y="661.90" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Authored a Caesar Cipher/DES/3DES cryptanalysis project requiring candidate-key generation, brute-force search, plaintext</text>
  <text x="55.00" y="672.35" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">verification, performance measurement, analytical reporting, and a recorded demonstration.</text>
