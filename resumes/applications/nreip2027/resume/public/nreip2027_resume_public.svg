  <text x="38.00" y="218.40" font-family="Liberation Sans" font-size="8.80" font-weight="400" font-style="normal" fill="#333333" text-anchor="start">Jun-Aug 2025; Jun-Aug 2026</text>
  <circle cx="44.00" cy="227.45" r="1.65" fill="#111111"/>
  <text x="55.00" y="230.15" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Developed and tested an operational-AI red-teaming framework on an autonomous vehicle with cybersecurity, computer science,</text>
  <text x="55.00" y="240.60" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">and electrical-engineering researchers using ROS2 and Gazebo.</text>
  <text x="38.00" y="254.85" font-family="Liberation Sans" font-size="9.60" font-weight="700" font-style="normal" fill="#111111" text-anchor="start">DQNGuard: Towards Open-World RF Preliminary-Action Detection</text>
  <text x="38.00" y="266.10" font-family="Liberation Sans" font-size="8.80" font-weight="400" font-style="normal" fill="#333333" text-anchor="start">First author | IEEE MILCOM 2026, accepted/to appear</text>
  <circle cx="44.00" cy="275.15" r="1.65" fill="#111111"/>
  <text x="55.00" y="277.85" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Designed and implemented the end-to-end DQNGuard pipeline for open-world RF preliminary-action detection, including a</text>
  <text x="55.00" y="288.30" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">multi-domain CNN and open-set decision layer; benchmarked against VarMax and a DQN-IDS-style baseline.</text>
  <circle cx="44.00" cy="297.85" r="1.65" fill="#111111"/>
  <text x="55.00" y="300.55" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Built an over-the-air SDR capture, preprocessing, and dataset pipeline for WiFi, Bluetooth, and Zigbee RF signals; designed,</text>
  <text x="55.00" y="311.00" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">trained, and evaluated experiments across five preliminary actions: Scan, Burst, Sustain, Hop, and Replay.</text>
  <circle cx="44.00" cy="320.55" r="1.65" fill="#111111"/>
  <text x="55.00" y="323.25" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Achieved 0.865 mean unknown-class F1 under a 5% known-rejection calibration budget, compared with 0.745 for VarMax and</text>
  <text x="55.00" y="333.70" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">0.701 for the DQN-IDS-style comparison head; designed and analyzed a 20-condition Target-Surrogate Matrix.</text>
  <text x="38.00" y="347.95" font-family="Liberation Sans" font-size="9.60" font-weight="700" font-style="normal" fill="#111111" text-anchor="start">Model Evaluation for Radio-Frequency Signal Modulation Classifiers in the Existence of Novel Samples</text>
  <text x="38.00" y="359.20" font-family="Liberation Sans" font-size="8.80" font-weight="400" font-style="normal" fill="#333333" text-anchor="start">First author | HICSS-59, published 2026; presented Jan. 8, 2026</text>
  <circle cx="44.00" cy="368.25" r="1.65" fill="#111111"/>
  <text x="55.00" y="370.95" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Developed and evaluated a class-conditioned RF open-set-recognition pipeline using an eight-channel CNN over raw I/Q, FFT,</text>
  <text x="55.00" y="381.40" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">DCT, and polar representations.</text>
  <circle cx="44.00" cy="390.95" r="1.65" fill="#111111"/>
  <text x="55.00" y="393.65" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">Evaluated nine open-set folds on RadioML 2018.01A, withholding one selected modulation as unknown per fold and running 30</text>
  <text x="55.00" y="404.10" font-family="Liberation Sans" font-size="9.10" font-weight="400" font-style="normal" fill="#111111" text-anchor="start">runs per fold.</text>
